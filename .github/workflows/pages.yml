name: Publish browser app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated checks
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s browser -p 'test_*.py' -v
          node --test browser/test_runtime.js
          python browser/generate_zip64_fixtures.py --check
          node --test browser/test_archive.js
          node --test browser/test_webcheck_client.js
          node --check static/app.js
          node --check browser/runtime.js
          node --check browser/python-worker.js
          node --check browser/archive.js
          node --check browser/webcheck-client.js
      - name: Build allowlisted static site
        run: python build_site.py --output _site --download-runtime
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
